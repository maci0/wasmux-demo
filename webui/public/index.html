<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wasmux: Linux on wasm32</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid #21262d;
    background: #161b22;
  }
  header h1 { font-size: 15px; font-weight: 600; color: #58a6ff; }
  header h1 span { color: #8b949e; font-weight: 400; }
  #status { font-size: 12px; color: #3fb950; }
  #status.err { color: #f85149; }
  main { flex: 1; display: flex; flex-direction: column; }
  #out {
    flex: 1; overflow: hidden; background: #010409;
    border-bottom: 1px solid #21262d;
  }
  #out canvas { display: block; width: 100%; height: 100%; }
  footer {
    padding: 8px 20px; font-size: 11px; color: #8b949e;
    border-top: 1px solid #21262d; background: #161b22;
    display: flex; gap: 16px;
  }
  footer a { color: #58a6ff; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>wasmux <span>: Linux 6.19 booting as a WebAssembly module</span></h1>
  <div id="status">booting…</div>
</header>
<main id="out"></main>
<footer>
  <span>kernel: linux-wasm @ v6.19 (arch/wasm)</span>
  <a href="https://github.com/maci0/linux-wasm/tree/wasm" target="_blank" rel="noopener">fork</a>
  <a href="https://github.com/maci0/wasmux-demo" target="_blank" rel="noopener">runtime</a>
  <span>single-threaded · cooperative · no userspace yet, see the README for honest limitations</span>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
